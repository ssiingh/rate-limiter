version: '3.9'

services:
  redis:
    image: redis:7.2-alpine
    container_name: ratelimiter-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --protected-mode no
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ratelimiter-dev-net

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: ratelimiter-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      PORT: 3000
      LOG_LEVEL: debug
    volumes:
      - ../src:/app/src
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ratelimiter-dev-net

volumes:
  redis_dev_data:
    driver: local

networks:
  ratelimiter-dev-net:
    driver: bridge
